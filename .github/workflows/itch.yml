# itch.io 자동 업로드 (butler). 필요한 것:
#   저장소 Secrets  BUTLER_API_KEY : itch.io → Settings → API keys 에서 만든 키
#   저장소 Variables ITCH_TARGET   : 「itch아이디/게임주소」 (예: myname/eveil)
# 손으로: GitHub → Actions → 「itch 올리기」 → Run workflow · 또는 tools/itch-release.txt 를 고쳐 배포 브랜치에 push
name: itch 올리기
on:
  workflow_dispatch:
  # 「itch 올려」 하면 Claude가 tools/itch-release.txt 를 고쳐 배포 브랜치에 올린다 → 자동 실행
  push:
    branches: [claude/sludge-roguelike-game-design-fndfdu]
    paths: ['tools/itch-release.txt']
concurrency: itch
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 테스트
        run: node tools/test.mjs
      - name: itch 묶음 만들기 (파일 1,000개 · 용량 제한을 넘으면 여기서 멈춘다)
        run: node tools/build-itch.mjs dist/itch
      - name: butler 받기
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler && ./butler/butler -V
      - name: 올리기
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          test -n "$BUTLER_API_KEY" || { echo "BUTLER_API_KEY가 없습니다"; exit 1; }
          test -n "$ITCH_TARGET" || { echo "ITCH_TARGET 변수가 없습니다 (예: myname/eveil)"; exit 1; }
          VER=$(grep -oP "GAME_VERSION = '\K[^']+" src/data/patchnotes.js)
          ./butler/butler push dist/itch "$ITCH_TARGET:html5" --userversion "$VER"
