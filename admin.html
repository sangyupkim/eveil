<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>에베이 관리</title>
  <style>
    :root { --bg: #14110f; --panel: #1e1915; --line: #4a3c2a; --ink: #eadfc8; --dim: #a8987a; --gold: #e8c36a; --chg: #4a3a10; --bad: #ff7a6a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: #0f0c0a; border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h1 { font-size: 17px; margin: 0 8px 0 0; color: var(--gold); }
    button, input, select, textarea { font: inherit; color: var(--ink); background: #2a231c; border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; }
    button { cursor: pointer; } button.pri { background: #6a4f1c; border-color: var(--gold); } button.on { background: #4a3a1c; border-color: var(--gold); color: var(--gold); }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--dim); font-size: 13px; }
    main { padding: 12px; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    .gridwrap { overflow: auto; max-height: calc(100vh - 170px); border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; }
    th, td { border-bottom: 1px solid #2c241b; padding: 3px 5px; white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--gold); text-align: left; z-index: 2; }
    td.k { color: var(--dim); font-size: 12px; } td.t { max-width: 14em; overflow: hidden; text-overflow: ellipsis; }
    td input { width: 6.5em; padding: 2px 5px; background: #1a1612; }
    td input.chg { background: var(--chg); border-color: var(--gold); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-width: 760px; margin-bottom: 12px; }
    .card label { display: block; margin: 6px 0 2px; color: var(--dim); }
    .card input, .card textarea { width: 100%; }
    .list .row { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #2c241b; padding: 6px 0; }
    .list .row .g { flex: 1; } .muted { color: var(--dim); font-size: 12px; }
    .warn { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>에베이 관리</h1>
    <button data-tab="balance" class="on">밸런스</button><button data-tab="mail">우편</button><button data-tab="notice">공지</button><button data-tab="chat">채팅</button>
    <input id="key" type="password" placeholder="관리 키 (ADMIN_KEY)" style="margin-left:auto" />
    <span id="status"></span>
  </header>

  <main data-pane="balance">
    <div class="bar">
      <select id="b-table"></select>
      <input id="b-q" placeholder="줄 검색 (아이디 · 이름)" />
      <button id="b-save" class="pri">서버에 저장 (게임을 새로 켜면 적용)</button>
      <button id="b-reset">이 표 바꾼 값 모두 지우기</button>
      <button id="b-json">JSON 받기</button>
      <span class="warn" id="b-count"></span>
    </div>
    <div id="b-grid"></div>
    <p class="warn">노란 칸 = 기본값에서 바꾼 값 (마우스를 올리면 기본값). 칸을 비우면 기본값으로 돌아갑니다. 저장하면 이용자가 게임을 새로 켤 때(자동 업데이트 포함) 적용됩니다.</p>
  </main>

  <main data-pane="mail" hidden>
    <div class="card">
      <b>우편 보내기</b>
      <label>받는 사람 — 계정 아이디 · 닉네임, 또는 * (모두: 지금 있는 모든 계정)</label><input id="m-to" placeholder="예: 용사  또는  *" />
      <label>제목</label><input id="m-title" maxlength="40" />
      <label>내용</label><textarea id="m-body" rows="3" maxlength="500"></textarea>
      <label>금화</label><input id="m-gold" type="number" min="0" value="0" />
      <label>아이템 (JSON 배열, 비워 두면 없음) — 복구할 장비 등. 예: [{"base":"rune_blade","rarity":"hero","ilvl":24}]</label><textarea id="m-items" rows="4" placeholder='[{"base":"...","rarity":"hero","ilvl":24,"affixes":[]}]'></textarea>
      <div class="bar" style="margin-top:8px"><button id="m-send" class="pri">보내기</button></div>
    </div>
    <div class="card"><b>보낸 우편</b> <button id="m-reload">새로 고침</button><div class="list" id="m-list"></div></div>
  </main>

  <main data-pane="notice" hidden>
    <div class="card">
      <b>공지 쓰기</b>
      <label>제목</label><input id="n-title" maxlength="60" />
      <label>내용</label><textarea id="n-body" rows="5" maxlength="2000"></textarea>
      <div class="bar" style="margin-top:8px"><button id="n-add" class="pri">올리기</button></div>
    </div>
    <div class="card"><b>공지 목록</b> (게임 첫 화면 · 메뉴 → 공지사항에 보입니다)<div class="list" id="n-list"></div></div>
  </main>

  <main data-pane="chat" hidden>
    <div class="card">
      <b>채팅 금지</b>
      <label>닉네임</label><input id="c-nick" maxlength="10" placeholder="예: 용사" />
      <label>기간</label><select id="c-min"><option value="60">1시간</option><option value="1440">1일</option><option value="10080">7일</option><option value="0">영구</option></select>
      <div class="bar" style="margin-top:8px"><button id="c-ban" class="pri">금지</button> <button id="c-reload">새로 고침</button> <span class="muted" id="c-on"></span></div>
    </div>
    <div class="card"><b>금지 · 도배로 잠시 막힌 사람</b><div class="list" id="c-bans"></div></div>
    <div class="card"><b>최근 대화 (50줄)</b><div class="list" id="c-log"></div></div>
  </main>

  <script type="module">
    import { TABLES } from './src/data/overrides.js';
    const API = (/\.workers\.dev$|\.pages\.dev$/.test(location.hostname) || location.port === '8787') ? '/api' : 'https://eveil.weak0416.workers.dev/api';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const status = (t, bad) => { $('status').textContent = t; $('status').style.color = bad ? 'var(--bad)' : ''; };
    const ERR = { admin: '관리 키가 맞지 않습니다 (Cloudflare에 ADMIN_KEY가 있는지 확인)', no_user: '받는 사람을 찾지 못했습니다', bad: '입력을 확인해 주세요', too_big: '바꾼 값이 너무 많습니다', offline: '서버에 닿지 않습니다' };
    async function api(body) {
      try { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return await r.json(); } catch { return { ok: false, error: 'offline' }; }
    }
    const admin = (body) => api({ ...body, admin: $('key').value.trim() });
    try { $('key').value = localStorage.getItem('eveil-admin-key') || ''; } catch {}
    $('key').onchange = () => { try { localStorage.setItem('eveil-admin-key', $('key').value); } catch {} };
    document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
      document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b));
      document.querySelectorAll('[data-pane]').forEach((p) => p.hidden = p.dataset.pane !== b.dataset.tab);
      if (b.dataset.tab === 'chat') loadChat(); if (b.dataset.tab === 'mail') loadMails(); if (b.dataset.tab === 'notice') loadNotices();
    });

    // ───── 밸런스: 게임 표(기본값) 위에 바꾼 값만 저장한다 ─────
    let work = {}, table = 'monsters';
    const DEF = {}; // 기본값 (덮어쓰기 전) — 이 페이지는 덮어쓰기를 적용하지 않으므로 표 그대로가 기본값
    for (const [t, T] of Object.entries(TABLES)) { DEF[t] = {}; for (const [k, r] of Object.entries(T.rows())) { DEF[t][k] = {}; for (const [c, C] of Object.entries(T.cols)) DEF[t][k][c] = C.get(r); } }
    $('b-table').innerHTML = Object.entries(TABLES).map(([t, T]) => `<option value="${t}">${T.name}</option>`).join('');
    const count = (t) => Object.values(work[t] || {}).reduce((n, r) => n + Object.keys(r).length, 0);
    const total = () => Object.keys(work).reduce((n, t) => n + count(t), 0);
    function grid() {
      const T = TABLES[table], q = $('b-q').value.trim().toLowerCase(), rows = T.rows(), ov = work[table] || {};
      const cols = Object.keys(T.cols).filter((c) => Object.values(DEF[table]).some((r) => r[c] !== undefined));
      const keys = Object.keys(rows).filter((k) => !q || k.toLowerCase().includes(q) || String(T.label(rows[k], k) || '').toLowerCase().includes(q)).slice(0, 600);
      $('b-grid').innerHTML = `<div class="gridwrap"><table><tr><th>아이디</th><th>이름</th>${cols.map((c) => `<th>${c}</th>`).join('')}</tr>${keys.map((k) => {
        const d = DEF[table][k], o = ov[k] || {};
        return `<tr data-k="${esc(k)}"><td class="k">${esc(k)}</td><td class="t">${esc(T.label(rows[k], k))}</td>${cols.map((c) => d[c] === undefined ? '<td></td>' : `<td><input data-c="${c}" inputmode="decimal" class="${c in o ? 'chg' : ''}" value="${esc(o[c] ?? d[c])}" title="기본값 ${esc(d[c])}"></td>`).join('')}</tr>`;
      }).join('')}</table></div>${Object.keys(rows).length > keys.length ? `<p class="warn">${keys.length}줄만 보입니다. 검색으로 좁히세요.</p>` : ''}`;
      $('b-count').textContent = `바꾼 칸: 이 표 ${count(table)} · 모두 ${total()}`;
    }
    $('b-grid').addEventListener('change', (e) => {
      const inp = e.target.closest('input[data-c]'); if (!inp) return;
      const k = inp.closest('tr').dataset.k, c = inp.dataset.c, base = DEF[table][k][c];
      const v = inp.value.trim() === '' ? base : Number(inp.value);
      if (!Number.isFinite(v)) { inp.value = base; return; }
      const t = (work[table] ||= {}), row = (t[k] ||= {});
      if (v === base) delete row[c]; else row[c] = v;
      if (!Object.keys(row).length) delete t[k]; if (!Object.keys(t).length) delete work[table];
      inp.value = v; inp.classList.toggle('chg', v !== base); status('저장 안 됨 (바뀐 값 있음)'); grid();
    });
    $('b-table').onchange = () => { table = $('b-table').value; grid(); };
    $('b-q').oninput = grid;
    $('b-reset').onclick = () => { if (confirm(`${TABLES[table].name} 표의 바꾼 값을 모두 지울까요? (저장해야 반영)`)) { delete work[table]; grid(); status('저장 안 됨'); } };
    $('b-json').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(work, null, 1)], { type: 'application/json' })); a.download = 'eveil-balance.json'; a.click(); };
    $('b-save').onclick = async () => {
      const r = await admin({ type: 'ash_admin_cfg', overrides: work });
      status(r.ok ? `저장했습니다 (바꾼 칸 ${total()}) — ${new Date().toLocaleTimeString()}` : ERR[r.error] || '저장 실패', !r.ok);
    };
    api({ type: 'ash_cfg' }).then((r) => { if (r.ok) { work = r.data || {}; status(r.at ? `서버 값을 불러왔습니다 (${new Date(r.at).toLocaleString()} 저장)` : '서버에 저장된 값이 없습니다 (모두 기본값)'); } else status('서버 값을 못 불러왔습니다', true); grid(); });

    // ───── 우편 ─────
    $('m-send').onclick = async () => {
      const to = $('m-to').value.trim(), gold = Number($('m-gold').value) || 0;
      if (!to || !$('m-title').value.trim()) { status('받는 사람과 제목을 적어 주세요', true); return; }
      if (to === '*' && !confirm(`모든 계정에 ${gold.toLocaleString()} G를 보낼까요?`)) return;
      let items = [];
      if ($('m-items').value.trim()) { try { items = JSON.parse($('m-items').value); if (!Array.isArray(items)) items = [items]; } catch (e) { status('아이템 JSON이 잘못되었습니다', true); return; } }
      if (items.length && to === '*' && !confirm(`모든 계정에 아이템 ${items.length}개를 보낼까요?`)) return;
      const r = await admin({ type: 'ash_admin_mail', to, title: $('m-title').value, body: $('m-body').value, gold, items });
      status(r.ok ? `보냈습니다 → ${r.to === '*' ? '모두' : r.to}${r.items ? ` · 아이템 ${r.items}개` : ''}` : ERR[r.error] || '보내지 못했습니다', !r.ok);
      if (r.ok) { $('m-title').value = ''; $('m-body').value = ''; $('m-items').value = ''; loadMails(); }
    };
    $('m-reload').onclick = () => loadMails();
    async function loadMails() {
      const r = await admin({ type: 'ash_admin_mails' });
      if (!r.ok) { $('m-list').innerHTML = `<p class="muted">${ERR[r.error] || '불러오지 못했습니다'}</p>`; return; }
      $('m-list').innerHTML = r.list.map((m) => `<div class="row"><div class="g"><b>${esc(m.title)}</b> <span class="muted">→ ${m.uid === '*' ? '모두' : esc(m.uid)} · ${new Date(m.at).toLocaleString()} · 받은 계정 ${m.got}</span></div><b>${Number(m.gold).toLocaleString()} G</b><button data-mdel="${m.id}">지우기</button></div>`).join('') || '<p class="muted">없음</p>';
      $('m-list').querySelectorAll('[data-mdel]').forEach((b) => b.onclick = async () => { if (confirm('이 우편을 지울까요? (아직 안 받은 사람은 못 받습니다)')) { await admin({ type: 'ash_admin_mail_del', id: b.dataset.mdel }); loadMails(); } });
    }

    // ───── 채팅 (v0.49.30): 금지 · 풀기 · 최근 대화 ─────
    async function loadChat() {
      const r = await admin({ type: 'ash_admin_chat', op: 'list' });
      if (!r.ok) { $('c-log').innerHTML = `<p class="muted">${ERR[r.error] || '불러오지 못했습니다'}</p>`; $('c-bans').innerHTML = ''; return; }
      $('c-on').textContent = `지금 연결 ${r.on}`;
      const left = (u) => (u ? `${Math.max(1, Math.ceil((u - Date.now()) / 60000))}분 남음` : '영구');
      $('c-bans').innerHTML = [...r.bans.map((b) => `<div class="row"><div class="g"><b>${esc(b.nick)}</b> <span class="muted">금지 · ${left(b.until)} · ${esc(b.k)}</span></div><button data-unban="${esc(b.k)}">풀기</button></div>`),
        ...r.mutes.map((m) => `<div class="row"><div class="g"><span class="muted">도배로 잠시 막힘 · ${left(m.until)} · ${esc(m.k)}</span></div><button data-unban="${esc(m.k)}">풀기</button></div>`)].join('') || '<p class="muted">없음</p>';
      $('c-log').innerHTML = [...r.log].reverse().map((m) => `<div class="row"><div class="g"><b>${esc(m.n)}</b> ${esc(m.x)} <span class="muted">${new Date(m.at).toLocaleString()} · ${esc(m.k || '')}</span></div><button data-bannick="${esc(m.n)}">금지</button></div>`).join('') || '<p class="muted">없음</p>';
      $('c-bans').querySelectorAll('[data-unban]').forEach((b) => b.onclick = async () => { const x = await admin({ type: 'ash_admin_chat', op: 'unban', k: b.dataset.unban }); status(x.ok ? '풀었습니다' : ERR[x.error] || '실패', !x.ok); loadChat(); });
      $('c-log').querySelectorAll('[data-bannick]').forEach((b) => b.onclick = () => { $('c-nick').value = b.dataset.bannick; $('c-nick').focus(); });
    }
    $('c-reload').onclick = () => loadChat();
    $('c-ban').onclick = async () => {
      const nick = $('c-nick').value.trim(), sel = $('c-min'); if (!nick) { status('닉네임을 적어 주세요', true); return; }
      if (!confirm(`${nick}의 채팅을 ${sel.options[sel.selectedIndex].text} 금지할까요?`)) return;
      const r = await admin({ type: 'ash_admin_chat', op: 'ban', nick, minutes: Number(sel.value) });
      status(r.ok ? `${r.nick} 채팅 금지` : ERR[r.error] || '실패', !r.ok); if (r.ok) { $('c-nick').value = ''; loadChat(); }
    };

    // ───── 공지 ─────
    $('n-add').onclick = async () => {
      const r = await admin({ type: 'ash_admin_notice_add', title: $('n-title').value, body: $('n-body').value });
      status(r.ok ? '공지를 올렸습니다' : ERR[r.error] || '올리지 못했습니다', !r.ok);
      if (r.ok) { $('n-title').value = ''; $('n-body').value = ''; loadNotices(); }
    };
    async function loadNotices() {
      const r = await api({ type: 'ash_notices' });
      $('n-list').innerHTML = (r.list || []).map((n) => `<div class="row"><div class="g"><b>${esc(n.title)}</b> <span class="muted">${new Date(n.at).toLocaleString()}</span><div class="muted" style="white-space:pre-wrap">${esc(n.body)}</div></div><button data-ndel="${n.id}">지우기</button></div>`).join('') || '<p class="muted">없음</p>';
      $('n-list').querySelectorAll('[data-ndel]').forEach((b) => b.onclick = async () => { if (!confirm('이 공지를 지울까요?')) return; const x = await admin({ type: 'ash_admin_notice_del', id: b.dataset.ndel }); status(x.ok ? '지웠습니다' : ERR[x.error] || '실패', !x.ok); loadNotices(); });
    }
  </script>
</body>
</html>
