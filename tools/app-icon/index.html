<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<svg id="ic" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a1a0e"/><stop offset=".55" stop-color="#120a05"/><stop offset="1" stop-color="#050302"/></radialGradient>
 <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416"><stop offset="0" stop-color="#fff1c2"/><stop offset=".35" stop-color="#e8b55a"/><stop offset=".6" stop-color="#a86d22"/><stop offset=".8" stop-color="#f0c876"/><stop offset="1" stop-color="#7a4c16"/></linearGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(255,160,60,.35)"/><stop offset="1" stop-color="rgba(255,120,40,0)"/></radialGradient>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".85"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="256" r="200" fill="url(#glow)"/>
<g id="knot" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)"></g>
</svg>
<script>
// 띠(band): 어두운 테두리 → 금빛 → 가는 하이라이트. 겹치는 곳은 위로 지나가는 조각을 다시 그려 엮인 모양을 만든다
const NS='http://www.w3.org/2000/svg', g=document.getElementById('knot');
const band=(d,w=24)=>{for(const [c,ww,o] of [['#1b0f05',w+12,1],['url(#gold)',w,1],['rgba(255,245,210,.55)',2.5,1]]){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('stroke',c);p.setAttribute('stroke-width',ww);p.setAttribute('stroke-linecap',ww<6?'round':'butt');p.setAttribute('opacity',o);g.appendChild(p);}};
// 고리
const R=170, ring=`M ${256-R} 256 A ${R} ${R} 0 1 0 ${256+R} 256 A ${R} ${R} 0 1 0 ${256-R} 256`;
band(ring,16);
const arcAt=(a0,a1)=>{const p=(a)=>[256+R*Math.cos(a),256+R*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1}`;};
// E: 위 팔 · 등줄기 · 아래 팔을 한 줄로 (끝은 바깥으로 휘어 오른다)
g.setAttribute('stroke-linejoin','miter');
band('M 214 256 L 282 256',24);
band('M 352 104 Q 350 146 314 146 L 204 146 L 204 366 L 314 366 Q 350 366 352 408',26);
// 가운데 팔 끝: 깨어남의 빛 (마름모)
band('M 282 256 L 310 228 L 338 256 L 310 284 Z',14);
// 엮기: 고리가 팔 끝 위로 지나간다 (오른쪽 위 · 아래)
band(arcAt(-1.2,-0.95),16); band(arcAt(0.95,1.2),16);
// 위아래 장식 마름모
for (const [x,y] of [[256,86],[256,426]]) band(`M ${x} ${y-12} L ${x+12} ${y} L ${x} ${y+12} L ${x-12} ${y} Z`,8);
</script></body></html>
