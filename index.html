<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>에베이</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="theme-svg.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="flare-ui.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="fx"></div>

  <div id="hud" hidden>
    <!-- 좌상단: 초상화 · HP · MP · 지역 · 기록 -->
    <div id="tl">
      <div class="who">
        <div class="portrait"><img id="face" alt="" /><div id="awakeBadge" class="lvpill">각성 0</div></div>
        <div class="bars">
          <div class="bar hp"><i></i><span></span></div>
          <div class="bar mp"><i></i><span></span></div>
          <div id="buffs"></div>
        </div>
      </div>
      <div class="pills">
        <div class="pill zone"><b class="dot"></b><span class="zoneName"></span></div>
        <div class="pill gold"><span id="gold">0</span> G</div>
        <div class="pill ore" title="강화석"><img id="oreIco" alt="" /><span id="oreN">0</span></div>
      </div>
      <!-- v0.49.7 미니맵은 체력바 밑 (누르면 지도) -->
      <div id="mapWrap"><canvas id="minimap" width="200" height="200"></canvas></div>
    </div>

    <!-- 우상단: 메뉴 단추 한 줄 · 퀘스트 · 기록 -->
    <div id="tr">
      <div class="menuCol">
        <button class="ibtn menu-toggle" id="menuToggle" title="메뉴 펼치기"><b class="chev"></b></button>
        <div class="menuItems" id="menuItems">
          <button data-win="menu" class="ibtn" title="메뉴 (Esc)"><img data-ico="g_gear" alt="" /></button>
          <button data-win="inv" class="ibtn" title="가방 (I)"><img data-ico="g_chest" alt="" /><span class="cnt" id="bagCnt">0/40</span></button>
          <button data-win="skills" class="ibtn" title="스킬 (K)"><img data-ico="g_book" alt="" /></button>
          <button data-win="char" class="ibtn" title="능력 (C)"><img data-ico="g_face" alt="" /></button>
          <button data-win="quest" class="ibtn" title="퀘스트 (J)"><img data-ico="g_quest" alt="" /></button>
          <button data-win="rank" class="ibtn" title="랭킹"><img data-ico="g_rank" alt="" /></button>
          <button data-win="shop" id="shopBtn" class="ibtn" title="상점" hidden><img data-ico="g_shop" alt="" /></button>
        </div>
      </div>
      <!-- v0.49.7 퀘스트 · 기록은 오른쪽 (누르면 퀘스트 창 · 기록 창) -->
      <div id="trBoxes">
      <div id="qPanel" class="hudBox">
        <button class="qhead" id="qpToggle">퀘스트 <small class="chev"></small></button>
        <div class="qbody">
          <div id="tutBox" hidden><b class="gear"></b><span></span></div>
          <div id="dailyBox"></div>
        </div>
      </div>
      <div id="questBox">
        <button class="qhead" id="qToggle">기록 <small class="chev"></small></button>
        <div class="qbody">
          <div class="zoneInfo"></div>
          <div id="log"></div>
        </div>
      </div>
      </div>
    </div>

    <div id="targetFrame" hidden><div class="tname"></div><div class="bar thp"><i></i><span></span></div></div>
    <div id="autoText" hidden>자동 사냥 중</div>
    <div id="toasts"></div>

    <!-- 하단 -->
    <div id="joyZone"></div>
    <div id="joy"><div class="knob"></div></div>
    <div id="quick"></div>
    <button id="btnFull" class="btn" hidden>전체 화면</button>
    <div id="br">
      <button id="btnRecall" class="act small" title="귀환 (R)"><img data-ico="g_home" alt="" /><span>귀환</span></button>
      <button id="btnAuto" class="act small" title="자동 사냥 (F)"><img data-ico="g_auto" alt="" /><span>자동</span></button>
      <button id="btnMp" class="act pot mp" title="마나 물약 (E)"><img data-ico="mpot" alt="" /><em>0</em></button>
      <button id="btnHp" class="act pot" title="체력 물약 (Q)"><img data-ico="hpot" alt="" /><em>0</em></button>
      <button id="btnAttack" class="act attack" title="공격 (Space)"><img data-ico="g_sword" alt="" /><span>공격</span></button>
    </div>
    <div id="zoneLoad" hidden><div><b></b><span>불러오는 중…</span><i class="zlBar"></i></div></div>
    <div id="expBar"><i></i><span></span></div>
  </div>

  <div id="window" class="screen" hidden>
    <div class="fs-head"><b class="gear"></b><h2></h2><div class="tabs"></div><button class="close" title="닫기 (Esc)"><span class="xmark"></span></button></div>
    <div class="body"></div>
  </div>
  <div id="startPick" class="screen" hidden>
    <div class="fs-head"><b class="gear"></b><h2>첫 무기</h2></div>
    <div class="body"><div class="cards4"></div><button id="btnStartPick" class="plate gold" disabled>이 무기로 시작</button></div>
  </div>
  <div id="awaken" hidden></div>
  <div id="death" hidden></div>

  <div id="title">
    <script>
      // v0.49.44 첫 화면 · 지역 불러오기 그림: 네 장 중 하나 (접속할 때마다 바뀐다)
      (function () { var n = 1 + Math.floor(Math.random() * 4); document.documentElement.style.setProperty('--keyArt', 'url(assets/title/key' + n + '.webp)'); window.__keyArt = n; })();
    </script>
    <div class="tbox">
      <p class="kicker">ÉVEIL · 깨어남</p>
      <h1>에베이</h1>
      <p class="sub">레벨은 없다. 네가 싸운 방식이 너를 만든다.</p>
      <p class="online" id="onlineNow" hidden></p>
      <div id="loadBar"><i></i></div>
      <button id="loadFix" class="plate gold" hidden>다시 불러오기</button>
      <script>
        // v0.44.19 로딩이 20초 넘게 멈추면: 예전 설치본(서비스 워커 · 그림 저장소)만 지우고 다시 연다. 캐릭터 저장(localStorage)은 그대로
        (function () {
          var fix = async function () {
            try { var rs = await navigator.serviceWorker?.getRegistrations?.(); for (var r of rs || []) await r.unregister(); } catch (e) {}
            try { for (var k of await caches.keys()) await caches.delete(k); } catch (e) {}
            location.reload();
          };
          var b = document.getElementById('loadFix'); b.onclick = fix; window.__loadFix = function () { b.hidden = false; };
          setTimeout(function () { var l = document.getElementById('loadBar'); if (l && !l.hidden) b.hidden = false; }, 20000);
        })();
      </script>
      <div id="titleMenu" hidden>
        <div id="charList" class="charList"></div>
        <div class="charBtns"><button id="btnPlay" class="plate gold">게임 시작</button><button id="btnNewChar" class="plate">새 캐릭터</button><button id="btnDelChar" class="plate">삭제</button><button id="btnInstall" class="plate">앱으로 설치</button></div>
        <div id="newChar" hidden>
          <div class="looks"></div>
          <input id="nameInput" maxlength="8" placeholder="닉네임 (나중에 정해도 됨)" />
          <div class="charBtns"><button id="btnNew" class="plate gold">만들기</button><button id="btnNewCancel" class="plate">취소</button></div>
          <div class="msg" id="newMsg"></div>
        </div>
        <div id="account"></div>
        <div id="notice" class="noticeBar" hidden></div>
        <p class="hint">PC: 클릭 이동/공격 · WASD · 1~8 스킬 · Q/E 물약 · F 자동사냥 · I/K/C/J 창 · Enter 채팅<br>모바일: 가로 화면 · 왼쪽 조이스틱 · 오른쪽 버튼</p>
      </div>
    </div>
    <div class="ver"><span id="verInfo"></span>모바일 가로 화면 권장 · 배경음과 효과음은 화면을 누르면 켜집니다</div>
  </div>
  <div id="rotate"><div class="phone"></div>기기를 가로로 돌려 주세요</div>

  <script type="module" src="src/main.js"></script>
  <div id="rotate"><div class="ph"></div><div>휴대폰을 가로로 돌려 주세요</div><button class="plate gold" id="btnRotate">가로 전체 화면</button></div>
</body>
</html>
