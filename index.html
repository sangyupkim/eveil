<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>잿빛 연대기</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="theme-svg.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="flare-ui.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="fx"></div>

  <div id="hud" hidden>
    <!-- 좌상단: 초상화 · HP · MP · 지역 · 기록 -->
    <div id="tl">
      <div class="who">
        <div class="portrait"><img id="face" alt="" /><div id="awakeBadge" class="lvpill">각성 0</div></div>
        <div class="bars">
          <div class="bar hp"><i></i><span></span></div>
          <div class="bar mp"><i></i><span></span></div>
          <div class="bar xp"><i></i></div>
          <div id="buffs"></div>
        </div>
      </div>
      <div class="pills">
        <div class="pill zone"><b class="dot"></b><span class="zoneName"></span></div>
        <div class="pill gold"><span id="gold">0</span> G</div>
      </div>
      <div id="questBox">
        <button class="qhead" id="qToggle">기록 <small class="chev"></small></button>
        <div class="qbody">
          <div class="zoneInfo"></div>
          <div id="log"></div>
        </div>
      </div>
    </div>

    <!-- 우상단: 미니맵 · 메뉴 단추 -->
    <div id="tr">
      <div id="mapWrap"><canvas id="minimap" width="200" height="200"></canvas></div>
      <div class="menuCol">
        <button class="ibtn menu-toggle" id="menuToggle" title="메뉴 펼치기"><b class="chev"></b></button>
        <div class="menuItems" id="menuItems">
          <button data-win="menu" class="ibtn" title="메뉴 (Esc)"><b class="gear"></b></button>
          <button data-win="inv" class="ibtn" title="가방 (I)"><img data-ico="chest" alt="" /><span class="cnt" id="bagCnt">0/40</span></button>
          <button data-win="skills" class="ibtn" title="스킬 (K)"><img data-ico="book" alt="" /></button>
          <button data-win="char" class="ibtn" title="능력 (C)"><img data-ico="face" alt="" /></button>
          <button data-win="town" class="ibtn" title="마을 (T)"><img data-ico="town" alt="" /></button>
          <button data-win="quest" class="ibtn" title="퀘스트 (J)"><img data-ico="scroll" alt="" /></button>
          <button data-win="shop" id="shopBtn" class="ibtn" title="상점" hidden><img data-ico="coin" alt="" /></button>
        </div>
      </div>
    </div>

    <div id="targetFrame" hidden><div class="tname"></div><div class="bar thp"><i></i><span></span></div></div>
    <div id="autoText" hidden>자동 사냥 중</div>
    <div id="tutBox" hidden><b class="gear"></b><span></span></div>
    <div id="toasts"></div>

    <!-- 하단 -->
    <div id="joyZone"></div>
    <div id="joy"><div class="knob"></div></div>
    <div id="quick"></div>
    <div id="br">
      <button id="btnRoll" class="act small" title="구르기 (Shift)"><img data-ico="boots" alt="" /><span>구르기</span></button>
      <button id="btnRecall" class="act small" title="귀환 (R)"><img data-ico="home" alt="" /><span>귀환</span></button>
      <button id="btnAuto" class="act small" title="자동 사냥 (F)"><img data-ico="duel" alt="" /><span>자동</span></button>
      <button id="btnMp" class="act pot mp" title="마나 물약 (E)"><img data-ico="mpot" alt="" /><em>0</em></button>
      <button id="btnHp" class="act pot" title="체력 물약 (Q)"><img data-ico="hpot" alt="" /><em>0</em></button>
      <button id="btnAttack" class="act attack" title="공격 (Space)"><img data-ico="sword" alt="" /><span>공격</span></button>
    </div>
    <div id="expBar"><i></i><span></span></div>
  </div>

  <div id="window" class="screen" hidden>
    <div class="fs-head"><b class="gear"></b><h2></h2><div class="tabs"></div><button class="close" title="닫기 (Esc)"><span class="xmark"></span></button></div>
    <div class="body"></div>
  </div>
  <div id="startPick" class="screen" hidden>
    <div class="fs-head"><b class="gear"></b><h2>첫 무기</h2></div>
    <div class="body"><div class="cards4"></div><button id="btnStartPick" class="plate gold" disabled>이 무기로 시작</button></div>
  </div>
  <div id="awaken" hidden></div>
  <div id="death" hidden></div>

  <div id="title">
    <div class="tbox">
      <p class="kicker">잊힌 왕국의 잿더미 위에서</p>
      <h1>잿빛 연대기</h1>
      <p class="sub">레벨은 없다. 네가 싸운 방식이 너를 만든다.</p>
      <div id="loadBar"><i></i></div>
      <div id="titleMenu" hidden>
        <div class="looks"></div>
        <input id="nameInput" maxlength="10" placeholder="이름" value="방랑자" />
        <button id="btnNew" class="plate gold">새로 시작</button>
        <button id="btnContinue" class="plate" hidden>이어하기</button>
        <div id="account"></div>
        <p class="hint">PC: 클릭 이동/공격 · WASD · 1~6 스킬 · Q/E 물약 · F 자동사냥 · I/K/C/J 창 · 휠 줌<br>모바일: 가로 화면 · 왼쪽 조이스틱 · 오른쪽 버튼</p>
      </div>
    </div>
    <div class="ver">모바일 가로 화면 권장 · 배경음과 효과음은 화면을 누르면 켜집니다</div>
  </div>
  <div id="rotate"><div class="phone"></div>기기를 가로로 돌려 주세요</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
