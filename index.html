<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1114" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>잿빛 연대기</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="fx"></div>

  <div id="hud" hidden>
    <!-- 좌상단: 각성 · HP · MP · 버프 · 지역/기록 -->
    <div id="tl">
      <div class="who">
        <div id="awakeBadge" class="badge" title="각성 횟수"><small>각성</small><b>0</b></div>
        <div class="bars">
          <div class="bar hp"><i></i><span></span></div>
          <div class="bar mp"><i></i><span></span></div>
          <div id="buffs"></div>
        </div>
      </div>
      <div id="questBox">
        <div class="zoneName"></div>
        <div class="zoneInfo"></div>
        <div id="log"></div>
      </div>
    </div>

    <!-- 우상단: 골드 · 메뉴 · 미니맵 -->
    <div id="tr">
      <div class="topbtns">
        <div id="gold">0</div>
        <button data-win="shop" id="shopBtn" class="ibtn" hidden><b>⚖</b>상점</button>
        <button data-win="inv" class="ibtn"><b>⛁</b>가방</button>
        <button data-win="skills" class="ibtn"><b>✦</b>스킬</button>
        <button data-win="char" class="ibtn"><b>☗</b>능력</button>
        <button data-win="menu" class="ibtn"><b>☰</b>메뉴</button>
      </div>
      <div id="mapWrap"><canvas id="minimap" width="160" height="160"></canvas><div id="mapZone"></div></div>
    </div>

    <div id="targetFrame" hidden><div class="tname"></div><div class="bar thp"><i></i></div></div>
    <div id="autoText" hidden>자동 사냥 중 <small>(EXP · 숙련 · 드랍 80%)</small></div>
    <div id="toasts"></div>

    <!-- 하단 -->
    <div id="joy"><div class="knob"></div></div>
    <div id="quick"></div>
    <div id="br">
      <button id="btnRecall" class="rbtn small" title="귀환 (R)">귀환</button>
      <button id="btnAuto" class="rbtn small" title="자동 사냥 (F)">AUTO</button>
      <button id="btnHp" class="rbtn pot" title="체력 물약 (Q)"><b>♥</b><span>0</span></button>
      <button id="btnMp" class="rbtn pot mp" title="마나 물약 (E)"><b>◆</b><span>0</span></button>
      <button id="btnAttack" class="rbtn attack" title="공격 (Space)">⚔</button>
    </div>
    <div id="expBar"><i></i><span></span></div>
  </div>

  <div id="window" hidden><div class="panel"><div class="head"><h2></h2><button class="close">✕</button></div><div class="body"></div></div></div>
  <div id="awaken" hidden></div>
  <div id="death" hidden></div>

  <div id="title">
    <div class="tbox">
      <h1>잿빛 연대기</h1>
      <p class="sub">레벨은 없다. 네가 싸운 방식이 너를 만든다.</p>
      <div id="loadBar"><i></i></div>
      <div id="titleMenu" hidden>
        <div class="looks"></div>
        <input id="nameInput" maxlength="10" placeholder="이름" value="방랑자" />
        <div class="tbtns">
          <button id="btnNew" class="big">새로 시작</button>
          <button id="btnContinue" class="big" hidden>이어하기</button>
        </div>
        <p class="hint">PC: 클릭 이동/공격 · WASD · 1~6 스킬 · Q/E 물약 · F 자동사냥 · I/K/C 창 · 휠 줌<br>모바일: 가로 화면 · 왼쪽 조이스틱 · 오른쪽 버튼</p>
      </div>
    </div>
  </div>
  <div id="rotate">가로로 돌려 주세요 ⟲</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
